# -----------------------
# Rate limiting zones
# -----------------------
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

# -----------------------
# HTTP server block
# -----------------------
server {
    listen 80;
    server_name websterwork.com www.websterwork.com app.websterwork.com;

    # ----------------------------------
    # REAL IP CONFIGURATION
    # ----------------------------------
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # ----------------------------------
    # Global proxy settings
    # ----------------------------------
    proxy_http_version 1.1;
    
    # 🔥 FIXED: Always send canonical hostname to backend
    proxy_set_header Host websterwork.com;
    # Keep original host for logging/debugging
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # ----------------------------------
    # 🔥 GLOBAL CORS HEADERS - SINGLE SOURCE OF TRUTH
    # ----------------------------------
    # Only allow specific origins with credentials
    set $cors_origin "";
    if ($http_origin ~* "^https://(websterwork\.com|www\.websterwork\.com|app\.websterwork\.com)$") {
        set $cors_origin $http_origin;
    }
    
    add_header Access-Control-Allow-Origin "$cors_origin" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, x-csrf-token, X-XSRF-TOKEN, Accept" always;
    add_header Access-Control-Expose-Headers "X-XSRF-TOKEN, x-csrf-token" always;
    add_header Access-Control-Max-Age 86400 always;

    # ----------------------------------
    # Frontend named location
    # ----------------------------------
    location @frontend {
        proxy_pass http://frontend:3000;
        proxy_set_header Host websterwork.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    # ----------------------------------
    # Next.js static assets
    # ----------------------------------
    location /_next/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host websterwork.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host websterwork.com;
        proxy_set_header X-Forwarded-Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ----------------------------------
    # ✅ FIXED AUTH API - Proper preflight handling
    # ----------------------------------
    location ~ ^/api/auth/(token|login|signup|refresh|logout|verify-signup) {
        # Handle preflight requests first
        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://backend:5000;
        proxy_set_header Host websterwork.com;
        proxy_set_header X-Forwarded-Host $host;
        limit_req zone=auth_limit burst=10 nodelay;
    }

    # ----------------------------------
    # ✅ FIXED OTHER API ENDPOINTS
    # ----------------------------------
    location /api/ {
        # Handle preflight requests first
        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://backend:5000;
        proxy_set_header Host websterwork.com;
        proxy_set_header X-Forwarded-Host $host;
        limit_req zone=api_limit burst=50 nodelay;
    }

    # ----------------------------------
    # Frontend catch-all
    # ----------------------------------
    location / {
        try_files $uri $uri/ @frontend;
        limit_req zone=general_limit burst=100 nodelay;
    }

    # ----------------------------------
    # Health check
    # ----------------------------------
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # ----------------------------------
    # Robots / sitemap
    # ----------------------------------
    location = /robots.txt {
        access_log off;
        expires max;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://websterwork.com/sitemap.xml\n";
    }

    location = /sitemap.xml {
        access_log off;
        try_files /sitemap.xml @frontend;
    }

    # ----------------------------------
    # Error pages
    # ----------------------------------
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html { 
        internal; 
        proxy_set_header Host websterwork.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://frontend:3000/404; 
    }
    
    location = /50x.html { 
        internal; 
        proxy_set_header Host websterwork.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://frontend:3000/500; 
    }

    # ----------------------------------
    # Security
    # ----------------------------------
    location ~ /\.(env|git|ht|dockerignore|gitignore|gitattributes) { 
        deny all; 
    }
    
    location ~* /(\.svn|\.git|\.hg|\.bzr|_darcs) { 
        deny all; 
    }
    
    location ~ /\. { 
        deny all; 
    }
}