# Define rate limit zone for API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name websterwork.com www.websterwork.com app.websterwork.com;

    # Hide nginx version
    server_tokens off;

    # Essential security headers (these won't break your app)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # TEMPORARY: Comment out CSP to get site working immediately
    # Or use Report-Only mode to see violations without blocking
    # add_header Content-Security-Policy-Report-Only "...";

    # Hide framework headers
    proxy_hide_header X-Powered-By;
    proxy_hide_header x-nextjs-cache;
    proxy_hide_header x-nextjs-prerender;
    proxy_hide_header x-nextjs-stale-time;

    # Frontend proxy
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API proxy with rate limiting
    location ^~ /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        limit_req zone=api_limit burst=20 nodelay;
    }

    # Optional: block /cgi-bin/ if exists
    location /cgi-bin/ {
        return 403;
    }

    # Optional: deny hidden files like .env
    location ~ /\. {
        deny all;
    }
}