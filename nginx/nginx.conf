# ===============================
# CORS: Allowed origins
# This maps the incoming Origin header.
# If it matches your domain, we reflect it.
# If not, it becomes empty ("") and no CORS header is sent.
# ===============================
map $http_origin $cors_origin {
    default "";
    "~^https://(websterwork\.com|www\.websterwork\.com)$" $http_origin;
}

# ===============================
# Rate limiting zones
# auth_limit  -> strict limit for login/signup/token
# api_limit   -> general API requests
# general_limit -> frontend requests
# ===============================
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

server {
    listen 80;
    server_name websterwork.com www.websterwork.com app.websterwork.com;

    # ==========================================
    # REAL IP CONFIGURATION
    # Ensures Nginx sees real client IP behind
    # Cloudflare and Docker
    # ==========================================
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ==========================================
    # Global proxy settings
    # Used by backend + frontend proxying
    # ==========================================
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # ==========================================
    # FRONTEND (Next.js) named location
    # Used when fallback routing is needed
    # ==========================================
    location @frontend {
        proxy_pass http://frontend:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    # ==========================================
    # Next.js static build files
    # Long cache for performance
    # ==========================================
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /_next/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ==========================================
    # ALL API ROUTES (Single Unified Block)
    # Handles:
    # - /api/auth/login
    # - /api/auth/signup
    # - /api/auth/token
    # - Any future /api/*
    # ==========================================
    location /api/ {

        proxy_pass http://backend:5000;

        # ------------------------------
        # Strict rate limit only for auth endpoints
        # ------------------------------
        if ($request_uri ~ ^/api/auth/) {
            limit_req zone=auth_limit burst=5;
        }

        # ------------------------------
        # General API rate limiting
        # ------------------------------
        limit_req zone=api_limit burst=20;

        # ------------------------------
        # Handle Preflight (OPTIONS)
        # Browser sends this before login
        # ------------------------------
        if ($request_method = OPTIONS) {
            if ($cors_origin != "") {
                add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, X-XSRF-TOKEN, x-csrf-token' always;
                add_header 'Access-Control-Max-Age' 86400 always;
            }
            return 204;
        }

        # ------------------------------
        # Normal API responses
        # Adds CORS headers to actual responses
        # ------------------------------
        if ($cors_origin != "") {
            add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }
    }

    # ==========================================
    # FRONTEND Catch-all
    # Serves Next.js app
    # ==========================================
    location / {
        try_files $uri $uri/ @frontend;
        limit_req zone=general_limit burst=50;
    }

    # ==========================================
    # Health check endpoint
    # Used by Docker / uptime monitors
    # ==========================================
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # ==========================================
    # Robots and sitemap
    # SEO support
    # ==========================================
    location = /robots.txt {
        access_log off;
        expires max;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://$host/sitemap.xml\n";
    }

    location = /sitemap.xml {
        access_log off;
        try_files /sitemap.xml @frontend;
    }

    # ==========================================
    # Error pages
    # ==========================================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html { internal; proxy_pass http://frontend:3000/404; }
    location = /50x.html { internal; proxy_pass http://frontend:3000/500; }

    # ==========================================
    # Block sensitive files
    # ==========================================
    location ~ /\.(env|git|ht|dockerignore|gitignore|gitattributes)$ { deny all; }
    location ~* /(\.svn|\.git|\.hg|\.bzr|_darcs) { deny all; }
    location ~ /\. { deny all; }

    # ==========================================
    # Basic security headers
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
