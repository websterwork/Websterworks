version: "3.9"

services:
  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"  # ADD THIS
    volumes:
      - frontend_node_modules:/app/node_modules

  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "5000:5000"  # ADD THIS
    env_file:
      - ./backend/.env.production
    depends_on:
      - mongo
    volumes:
      - backend_node_modules:/app/node_modules
      - backend_storage:/app/data

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      # REMOVE 443:443 - we don't have certificates yet
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      # REMOVE certbot volumes for now
    depends_on:
      - frontend
      - backend
    restart: always

  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: websterwork
    volumes:
      - mongo_data:/data/db

volumes:
  frontend_node_modules:
  backend_node_modules:
  backend_storage:
  mongo_data:
  # REMOVE certbot volumes