# =========================================================
# GLOBAL RATE LIMITING ZONES
# =========================================================
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# =========================================================
# HTTP → HTTPS REDIRECT (PORT 80)
# =========================================================
server {
    listen 80;
    server_name websterwork.com www.websterwork.com app.websterwork.com;
    return 301 https://$host$request_uri;
}

# =========================================================
# HTTPS SERVER (CLOUDFLARE ORIGIN CERT)
# =========================================================
server {
    listen 443 ssl http2;
    server_name websterwork.com www.websterwork.com app.websterwork.com;

    # -----------------------------------------------------
    # Cloudflare Origin Certificate
    # -----------------------------------------------------
    ssl_certificate     /etc/ssl/certs/cf-origin.crt;
    ssl_certificate_key /etc/ssl/private/cf-origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # -----------------------------------------------------
    # SECURITY HEADERS
    # -----------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    # -----------------------------------------------------
    # REAL IP (TRUST CLOUDFLARE)
    # -----------------------------------------------------
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # -----------------------------------------------------
    # GLOBAL PROXY SETTINGS
    # -----------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;

    # -----------------------------------------------------
    # FRONTEND (NEXT.JS)
    # -----------------------------------------------------
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -----------------------------------------------------
    # BACKEND API
    # -----------------------------------------------------

    # Auth APIs (very tight)
    location ~ ^/api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:5000;
    }

    # General APIs
    location /api/ {
        limit_req zone=api_limit burst=20;
        proxy_pass http://backend:5000;
    }

    # -----------------------------------------------------
    # UTILITIES
    # -----------------------------------------------------
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    location = /robots.txt {
        access_log off;
        return 200 "User-agent: *\nAllow: /\n";
    }
}
