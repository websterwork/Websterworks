# ===============================
# Websterwork Nginx Config
# For read-only container + tmpfs logs
# ===============================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

# Main server
server {
    listen 80;
    server_name websterwork.com www.websterwork.com app.websterwork.com;

    # -----------------------
    # Logging (write to tmpfs)
    # -----------------------
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log combined;

    # -----------------------
    # Security headers
    # -----------------------
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # -----------------------
    # Limits & timeouts
    # -----------------------
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_body_timeout 30;
    client_header_timeout 30;
    keepalive_timeout 65;
    send_timeout 30;

    # -----------------------
    # Gzip compression
    # -----------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # -----------------------
    # Frontend static assets (Next.js)
    # -----------------------
    location /_next/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, immutable";

        proxy_cache_bypass $http_upgrade;
    }

    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # -----------------------
    # API proxy (NestJS)
    # -----------------------
    location /api/ {
        proxy_pass http://backend:5000;  # Preserve /api/ prefix
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # CORS (if backend doesn't set)
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        # OPTIONS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "$http_origin";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Type "text/plain charset=UTF-8";
            add_header Content-Length 0;
            return 204;
        }

        # Security & rate limiting
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        limit_req zone=api_limit burst=50 nodelay;

        # Extra limit for auth endpoints
        location ~ ^/api/auth/(token|login|signup) {
            limit_req zone=auth_limit burst=10 nodelay;
        }
    }

    # -----------------------
    # Catch-all frontend
    # -----------------------
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        limit_req zone=general_limit burst=100 nodelay;

        proxy_cache_bypass $http_upgrade;
    }

    # -----------------------
    # Health check endpoint
    # -----------------------
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # -----------------------
    # Favicon, robots, sitemap
    # -----------------------
    location = /favicon.ico { access_log off; log_not_found off; try_files /favicon.ico @frontend; }
    location = /robots.txt { access_log off; log_not_found off; expires max; return 200 "User-agent: *\nAllow: /\nSitemap: https://$host/sitemap.xml\n"; }
    location = /sitemap.xml { access_log off; log_not_found off; try_files /sitemap.xml @frontend; }

    # -----------------------
    # Custom error pages
    # -----------------------
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html { internal; proxy_pass http://frontend:3000/404; }
    location = /50x.html { internal; proxy_pass http://frontend:3000/500; }

    # -----------------------
    # Block sensitive paths & hidden files
    # -----------------------
    location ~ /\.(env|git|ht|dockerignore|gitignore|gitattributes) { deny all; return 404; }
    location ~* /(\.svn|\.git|\.hg|\.bzr|_darcs) { deny all; return 404; }
    location ~ /\. { deny all; return 404; }
}
