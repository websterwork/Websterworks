# =========================
# Global HTTP Configuration
# =========================

# Logging format
log_format webster_detailed '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'host=$host origin=$http_origin '
                            'method=$request_method uri=$request_uri '
                            'upstream=$upstream_addr upstream_status=$upstream_status';

error_log /dev/stderr notice;

# =========================
# Rate Limiting Zones
# =========================
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

# =========================
# CORS Origin Mapping
# =========================
map $http_origin $cors_origin {
    default "";
    "~^https?://(www\.)?websterwork\.com$" $http_origin;
    "~^https?://websterchat\.websterwork\.com$" $http_origin;
}

# =========================
# Docker DNS Resolver
# =========================
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
