version: "3.9"

services:
  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - frontend_node_modules:/app/node_modules
    networks: # ADD THIS
      - app-network # ADD THIS

  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.production
    depends_on:
      - mongo
    volumes:
      - backend_node_modules:/app/node_modules
      - backend_storage:/app/data
    networks: # ADD THIS
      - app-network # ADD THIS

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: always
    networks: # ADD THIS
      - app-network # ADD THIS

  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: websterwork
    volumes:
      - mongo_data:/data/db
    networks: # ADD THIS
      - app-network # ADD THIS

volumes:
  frontend_node_modules:
  backend_node_modules:
  backend_storage:
  mongo_data:

# ADD THIS ENTIRE SECTION
networks:
  app-network:
    driver: bridge
