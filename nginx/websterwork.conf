server {
    listen 80;
    server_name websterwork.com www.websterwork.com;

    access_log /dev/stdout webster_detailed;

    # =========================
    # Security Headers
    # =========================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =========================
    # Protect Sensitive Files
    # =========================
    location ~ /\.(env|git|ht|dockerignore|gitignore|gitattributes)$ { deny all; access_log off; }
    location ~* /(\.svn|\.git|\.hg|\.bzr|_darcs) { deny all; access_log off; }
    location ~ /\. { deny all; access_log off; }

    # =========================
    # Frontend
    # =========================
    location @frontend {
        proxy_pass http://websterwork-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_next/static/ {
        proxy_pass http://websterwork-frontend:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /_next/ {
        proxy_pass http://websterwork-frontend:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # =========================
    # Auth APIs (strict limit)
    # =========================
    location ~ ^/api/auth/(token|login|signup)$ {
        limit_req zone=auth_limit burst=5;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;

        if ($request_method = OPTIONS) { return 204; }

        proxy_pass http://websterwork-backend:5000;
    }

    # =========================
    # General APIs
    # =========================
    location /api/ {
        limit_req zone=api_limit burst=20;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;

        if ($request_method = OPTIONS) { return 204; }

        proxy_pass http://websterwork-backend:5000;
    }

    # =========================
    # Catch All
    # =========================
    location / {
        try_files $uri $uri/ @frontend;
        limit_req zone=general_limit burst=50;
    }

    # =========================
    # Health
    # =========================
    location /health {
        return 200 "healthy\n";
    }
}
