version: "3.9"

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel run websterwork
    restart: unless-stopped
    volumes:
      - /home/soul00/.cloudflared:/home/nonroot/.cloudflared:ro
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - app-network
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - ./backend/.env.production
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
  nginx:
    image: nginx:1.29-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/soul00/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/soul00/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- https://127.0.0.1/health --no-check-certificate || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: webster
      MONGO_INITDB_ROOT_PASSWORD: webster.00
      MONGO_INITDB_DATABASE: websterwork
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    expose:
      - "27017"
    ports:
      - "100.103.125.7:27017:27017"
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
