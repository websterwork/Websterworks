# Define rate limit zone for API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    # Handle both www and non-www versions
    server_name websterwork.com www.websterwork.com app.websterwork.com;

    # Hide nginx version
    server_tokens off;

    # Essential security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CORS headers for API
    add_header Access-Control-Allow-Origin "https://www.websterwork.com https://websterwork.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "https://www.websterwork.com https://websterwork.com";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
        add_header Access-Control-Allow-Credentials "true";
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # Hide framework headers
    proxy_hide_header X-Powered-By;
    proxy_hide_header x-nextjs-cache;
    proxy_hide_header x-nextjs-prerender;
    proxy_hide_header x-nextjs-stale-time;

    # Frontend proxy
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Fix for Next.js specific paths
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        proxy_read_timeout 60s;
        
        # Handle Next.js _rsc requests
        location ~ ^/_rsc {
            proxy_pass http://frontend:3000;
        }
    }

    # API proxy with rate limiting
    location ^~ /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers specifically for API
        add_header Access-Control-Allow-Origin "https://www.websterwork.com https://websterwork.com" always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        proxy_read_timeout 60s;

        limit_req zone=api_limit burst=20 nodelay;
    }

    # Optional: block /cgi-bin/ if exists
    location /cgi-bin/ {
        return 403;
    }

    # Optional: deny hidden files like .env
    location ~ /\. {
        deny all;
    }
}

# Add a redirect from non-www to www (or vice versa) to avoid CORS issues
server {
    listen 80;
    server_name websterwork.com;
    # Uncomment one of these to force either www or non-www
    # return 301 https://www.websterwork.com$request_uri;  # Redirect to www
    # return 301 https://websterwork.com$request_uri;      # Keep non-www
}