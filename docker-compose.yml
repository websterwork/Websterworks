version: "3.9"

services:
  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    volumes:
      - frontend_node_modules:/app/node_modules

  backend:
    build: ./backend
    container_name: backend
    restart: always
    env_file:
      - ./backend/.env.production
    depends_on:
      - mongo
    volumes:
      - backend_node_modules:/app/node_modules
      - backend_storage:/app/data

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    restart: always

  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: websterwork
    volumes:
      - mongo_data:/data/db

volumes:
  frontend_node_modules:
  backend_node_modules:
  backend_storage:
  certbot_etc:
  certbot_www:
  mongo_data:
