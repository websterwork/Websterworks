# ~/Websterworks/nginx/nginx.conf

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

# Main server block
server {
    listen 80;
    server_name websterwork.com www.websterwork.com;
    
    # Basic security
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Size limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    
    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;
    
    # Frontend - Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Security headers for frontend
        proxy_hide_header X-Powered-By;
        proxy_hide_header x-nextjs-cache;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer overflow protection
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Rate limiting for general traffic
        limit_req zone=general_limit burst=50 nodelay;
    }
    
    # Backend API - with specific security
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Security headers for API
        proxy_hide_header X-Powered-By;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffer overflow protection
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        
        # Special rate limiting for auth endpoints
        location ~ ^/api/auth/ {
            limit_req zone=auth_limit burst=3 nodelay;
        }
    }
    
    # Block sensitive paths and files
    location ~ /\.(env|git|ht|dockerignore|gitignore|gitattributes) {
        deny all;
        return 404;
    }
    
    location ~* /(\.svn|\.git|\.hg|\.bzr|_darcs) {
        deny all;
        return 404;
    }
    
    location ~* /(cgi-bin|wp-admin|wp-includes|administrator|phpmyadmin|mysql-admin) {
        deny all;
        return 404;
    }
    
    location ~* \.(bak|save|swo|swp|old|orig|backup|copy)$ {
        deny all;
        return 404;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
    
    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Favicon and robots - prevent logging
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }
    
    location = /robots.txt {
        access_log off;
        log_not_found off;
        return 200 "User-agent: *\nDisallow:\n";
    }
}

# Block invalid Host headers
server {
    listen 80 default_server;
    server_name _;
    
    # Log and block invalid requests
    access_log /var/log/nginx/invalid_host.log;
    
    # Return 444 (no response) for invalid hosts
    return 444;
}