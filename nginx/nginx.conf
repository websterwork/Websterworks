# ---------------------------------------------------------
# Rate Limiting (Protects API from DDoS/Brute Force)
# ---------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    server_name websterwork.com www.websterwork.com app.websterwork.com;

    # 1. SECURITY HEADERS (Security Proofing)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    # 2. REAL IP (Trust Cloudflare Tunnel)
    set_real_ip_from  172.16.0.0/12;
    real_ip_header    X-Forwarded-For;

    # 3. GLOBAL PROXY SETTINGS
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https; # Prevents Redirect Loops

    # ---------------------------------------------------------
    # FRONTEND & NEXT.JS CACHING
    # ---------------------------------------------------------
    
    # Cache Next.js Static Assets (Massive Performance Boost)
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Main Frontend Catch-all
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Security: Deny hidden files
        location ~ /\. { deny all; }
    }

    # ---------------------------------------------------------
    # BACKEND API
    # ---------------------------------------------------------

    # Auth Endpoints (Tight Rate Limit)
    location ~ ^/api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend:5000;
    }

    # General API
    location /api/ {
        limit_req zone=api_limit burst=20;
        proxy_pass http://backend:5000;
    }

    # ---------------------------------------------------------
    # UTILITIES
    # ---------------------------------------------------------

    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Robots.txt for SEO
    location = /robots.txt {
        access_log off;
        return 200 "User-agent: *\nAllow: /\n";
    }
}
